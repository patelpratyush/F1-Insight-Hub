[project]
name = "f1-worker"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "f1-core", "f1-db",
  "arq>=0.26",
  "httpx>=0.27",
  "tenacity>=9.0",
  "structlog>=24.4",
  "pydantic-settings>=2.6",
  "sentry-sdk>=2.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1_worker"]
