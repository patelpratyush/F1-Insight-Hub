[project]
name = "f1-insight-hub"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/core-py", "packages/db-py"]

[tool.uv.sources]
f1-core = { workspace = true }
f1-db = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "hypothesis>=6.115",
  "mypy>=1.13",
  "ruff>=0.8",
  "httpx>=0.27",
  "respx>=0.21",
  "testcontainers[postgres,redis]>=4.8",
  "asgi-lifespan>=2.1",
  "pydantic>=2.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
explicit_package_bases = true
mypy_path = ["apps/api/src", "apps/worker/src", "packages/core-py/src", "packages/db-py/src"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
