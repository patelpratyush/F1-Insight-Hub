[project]
name = "f1-db"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "f1-core",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "boto3>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1_db"]
