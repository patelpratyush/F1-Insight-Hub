app = "f1-insight-api"
primary_region = "iad"
[build]
  dockerfile = "../docker/api.Dockerfile"
[deploy]
  release_command = "sh -c 'cd packages/db-py && alembic upgrade head'"
[http_service]
  internal_port = 8000
  force_https = true
  min_machines_running = 1
  [[http_service.checks]]
    path = "/readyz"
    interval = "15s"
    timeout = "3s"
